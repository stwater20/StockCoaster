<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!--SEO:HEAD--><title>股市雲霄飛車 StockCoaster｜把台股走勢變成像素雲霄飛車</title>
  <meta name="description" content="輸入台股代號，股價走勢立刻變成像素雲霄飛車：漲是爬坡、跌是俯衝，附 AI 預言家、成就系統與亮暗主題。" /><!--/SEO:HEAD-->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // 主題：先套用，避免閃爍
    (function () {
      var t = null;
      try { t = localStorage.getItem('stockcoaster.theme'); } catch (e) {}
      if (!t) { var h = (new Date().getUTCHours() + 8) % 24; t = h >= 6 && h < 18 ? 'light' : 'dark'; } // 預設跟著台灣時間：白天亮、晚上暗
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path d="m17 10 4 4m0-4-4 4"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5M10 20v-5h4v5"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5-12-7.5Z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3c.6 4.5 2.5 6.4 7 7-4.5.6-6.4 2.5-7 7-.6-4.5-2.5-6.4-7-7 4.5-.6 6.4-2.5 7-7Z"/><path d="M19 15.5c.3 1.6 1 2.3 2.5 2.5-1.6.3-2.3 1-2.5 2.5-.3-1.6-1-2.3-2.5-2.5 1.6-.3 2.3-1 2.5-2.5Z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M6 12v7h12v-7"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="logo glass" id="logo"><canvas id="logoSprite" width="14" height="15"></canvas><b>股市雲霄飛車</b><span>台股版</span></div>
    <div class="tools">
      <button class="icon glass" id="btnAch" title="成就"><svg><use href="#i-trophy"/></svg><span id="achCount">0/0</span></button>
      <button class="icon glass round" id="btnTheme" title="白天／夜晚模式" aria-label="切換白天／夜晚模式"><svg><use href="#i-sun"/></svg></button>
      <button class="icon glass round" id="btnSound" title="音效"><svg><use href="#i-sound"/></svg></button>
      <button class="icon glass round hidden" id="btnHome" title="回選單"><svg><use href="#i-home"/></svg></button>
    </div>
  </header>

  <!-- 選股面板 -->
  <section id="menu" class="panel glass menu">
    <h1><!--SEO:H1-->今天想坐哪一檔？<!--/SEO:H1--></h1>
    <p class="sub">股價就是軌道：漲是爬坡、跌是俯衝，紅漲綠跌。可以放著自動看，也能切到遊戲模式跳躍吃金幣。</p>

    <div class="label">熱門路線</div>
    <div class="chips" id="presetChips"></div>

    <div class="label">自選代號</div>
    <div class="row">
      <input id="codeInput" list="codeList" placeholder="輸入代號，例如 2603、6488、00878" maxlength="10" />
      <datalist id="codeList"></datalist>
    </div>

    <div class="label">搭乘期間</div>
    <div class="seg" id="rangeSeg">
      <button data-v="3mo">3 個月</button>
      <button data-v="6mo">半年</button>
      <button data-v="ytd">今年</button>
      <button data-v="1y" class="on">1 年</button>
      <button data-v="2y">2 年</button>
      <button data-v="5y">5 年</button>
      <button data-v="10y">10 年</button>
      <button data-v="custom">自訂…</button>
    </div>
    <div class="daterow hidden" id="dateRow">
      <input type="date" id="dateStart" min="2000-01-01" aria-label="開始日期" />
      <span>→</span>
      <input type="date" id="dateEnd" min="2000-01-01" aria-label="結束日期" />
      <button id="dateApply">套用</button>
    </div>

    <div class="label">乘客</div>
    <div class="seg passengers" id="paxSeg"></div>

    <div class="label">模式</div>
    <div class="seg" id="modeSeg">
      <button data-v="auto" class="on">🎢 自動觀賞</button>
      <button data-v="game">🎮 遊戲模式</button>
    </div>

    <div class="label">發車前猜猜看：終點會比起點……</div>
    <div class="seg" id="guessSeg">
      <button data-v="up">📈 更高</button>
      <button data-v="down">📉 更低</button>
      <button data-v="skip" class="on">🤷 不猜</button>
    </div>

    <button id="btnGo" class="go">發車！</button>
    <div id="menuMsg" class="msg"></div>

    <details class="about">
      <summary>關於股市雲霄飛車・熱門路線</summary>
      <div class="about-body"><!--SEO:ABOUT--><!--/SEO:ABOUT--></div>
    </details>
    <a class="promo" href="https://sectools.tw/?utm_source=stockcoaster&amp;utm_medium=referral&amp;utm_campaign=menu" target="_blank" rel="noopener">
      <span class="gicon sm">🧰</span><span><b>SecTools.tw</b> 更多免費工具與小遊戲：免安裝、免註冊，隨點即用</span><svg><use href="#i-arrow"/></svg>
    </a>
  </section>

  <!-- 搭乘中 HUD -->
  <section id="hud" class="hidden">
    <div class="hud-card glass stock">
      <div class="hud-name" id="hudName">—</div>
      <div class="hud-date" id="hudDate">—</div>
      <div class="hud-price"><span id="hudPrice">—</span> <small id="hudChg">—</small></div>
      <div class="hud-ret">累積 <b id="hudRet">0%</b></div>
    </div>
    <div class="hud-card glass gauges">
      <div class="g"><span>時速</span><b id="hudSpeed">0</b><small>km/h</small></div>
      <div class="g"><span>G 力</span><b id="hudG">1.0</b><small>G</small></div>
      <div class="g scream"><span>尖叫指數</span><div class="meter"><i id="hudScream"></i></div></div>
    </div>
    <div class="hud-card glass scorecard hidden" id="scoreCard"><span id="hudHearts"></span><b id="hudScore">0</b><small id="hudCombo"></small></div>
    <div class="hud-card glass minimap"><canvas id="minimap" width="200" height="26"></canvas></div>
    <button class="hud-card glass oracle collapsed" id="oracleMini"></button>
    <div class="commentary" id="commentary"></div>
    <div class="controls glass">
      <button data-spd="0.5">0.5×</button>
      <button data-spd="1" class="on">1×</button>
      <button data-spd="2">2×</button>
      <button data-spd="4">4×</button>
      <span class="sep"></span>
      <button id="btnPause" class="icon-txt"><svg><use href="#i-pause"/></svg><span>我要下車</span></button>
    </div>
  </section>

  <section id="summary" class="panel glass summary hidden"></section>

  <section id="achPanel" class="panel glass achpanel hidden">
    <div class="ach-head"><h2>成就牆</h2><button class="icon glass round" id="achClose"><svg><use href="#i-close"/></svg></button></div>
    <div class="ach-grid" id="achGrid"></div>
  </section>

  <div id="toasts"></div>
  <div id="loading" class="hidden"><div class="glass loader"><div class="spinner"></div><div id="loadingText">正在鋪軌道…</div></div></div>

  <script type="module" src="app.js"></script>
</body>
</html>
